spring.application.name=roamio-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5433/roamio}
spring.datasource.username=${DB_USERNAME:roamio}
spring.datasource.password=${DB_PASSWORD:roamio}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-long-random-value-123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

spring.jackson.time-zone=Asia/Kolkata
